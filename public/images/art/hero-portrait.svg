<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-hidden="true" preserveAspectRatio="xMidYMid slice">
  <!-- Brand art: a bright desk, the book stack from the boards, a branded mug.
       Replace with a real photo by pointing site.images.hero at it. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fdfaf5"/>
      <stop offset="0.55" stop-color="#f3ece1"/>
      <stop offset="1" stop-color="#e8dcc9"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d2b489"/>
      <stop offset="1" stop-color="#b8935f"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#1d3c68"/>
      <stop offset="1" stop-color="#0b1b31"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#8ea184"/>
      <stop offset="1" stop-color="#63745c"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="softer" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <rect width="1200" height="1500" fill="url(#wall)"/>

  <!-- window light -->
  <g opacity="0.75">
    <polygon points="760,0 1200,0 1200,560 620,1040" fill="url(#beam)"/>
    <polygon points="980,0 1200,0 1200,300 900,760" fill="url(#beam)" opacity="0.6"/>
  </g>
  <circle cx="1030" cy="250" r="230" fill="#ffffff" opacity="0.5" filter="url(#softer)"/>

  <!-- desk -->
  <rect x="0" y="1010" width="1200" height="490" fill="url(#desk)"/>
  <rect x="0" y="1010" width="1200" height="14" fill="#e2c9a3" opacity="0.8"/>
  <ellipse cx="600" cy="1060" rx="520" ry="46" fill="#8a6a3f" opacity="0.18" filter="url(#soft)"/>

  <!-- laptop -->
  <g>
    <ellipse cx="420" cy="1022" rx="290" ry="30" fill="#7d5f38" opacity="0.28" filter="url(#soft)"/>
    <rect x="182" y="560" width="470" height="330" rx="16" fill="#e7e9ee"/>
    <rect x="196" y="574" width="442" height="302" rx="10" fill="url(#screen)"/>
    <g opacity="0.55">
      <rect x="228" y="612" width="170" height="13" rx="6" fill="#e0a43a"/>
      <rect x="228" y="652" width="330" height="9" rx="4" fill="#ffffff" opacity="0.55"/>
      <rect x="228" y="678" width="290" height="9" rx="4" fill="#ffffff" opacity="0.4"/>
      <rect x="228" y="704" width="316" height="9" rx="4" fill="#ffffff" opacity="0.4"/>
      <rect x="228" y="744" width="120" height="26" rx="6" fill="#e0a43a"/>
    </g>
    <polygon points="150,890 684,890 730,1010 104,1010" fill="#dfe3e9"/>
    <polygon points="150,890 684,890 690,906 144,906" fill="#c8ced8"/>
    <rect x="330" y="978" width="174" height="10" rx="5" fill="#c1c8d3"/>
  </g>


  <!-- branded mug -->
  <g>
    <ellipse cx="300" cy="1188" rx="112" ry="20" fill="#7d5f38" opacity="0.32" filter="url(#soft)"/>
    <path d="M392 1054h34a44 44 0 0 1 0 88h-34z" fill="none" stroke="#12294a" stroke-width="16"/>
    <rect x="212" y="1040" width="186" height="150" rx="20" fill="#12294a"/>
    <ellipse cx="305" cy="1044" rx="93" ry="17" fill="#1d3c68"/>
    <circle cx="305" cy="1116" r="38" fill="none" stroke="#e0a43a" stroke-width="3"/>
    <circle cx="305" cy="1116" r="30" fill="none" stroke="#e0a43a" stroke-width="1.5" opacity="0.7"/>
    <text x="305" y="1124" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#e0a43a">GH</text>
  </g>

  <!-- plant, sitting behind the books -->
  <g>
    <g fill="url(#leaf)">
      <ellipse cx="1108" cy="852" rx="24" ry="66"/>
      <ellipse cx="1052" cy="884" rx="22" ry="60" transform="rotate(-28 1052 884)"/>
      <ellipse cx="1164" cy="884" rx="22" ry="60" transform="rotate(28 1164 884)"/>
      <ellipse cx="1068" cy="944" rx="19" ry="52" transform="rotate(-48 1068 944)"/>
      <ellipse cx="1148" cy="944" rx="19" ry="52" transform="rotate(48 1148 944)"/>
    </g>
    <path d="M1048 984h120l-15 120h-90z" fill="#f1e7d7"/>
    <rect x="1042" y="972" width="132" height="24" rx="8" fill="#fbf8f2"/>
  </g>

  <!-- book stack, spines carry the promise from the boards -->
  <g font-family="Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="2">
    <ellipse cx="840" cy="1018" rx="215" ry="26" fill="#7d5f38" opacity="0.3" filter="url(#soft)"/>
    <rect x="636" y="938" width="404" height="68" rx="8" fill="#12294a"/>
    <text x="668" y="980" font-size="22" fill="#ffffff" opacity="0.92">A MORE CONFIDENT YOU</text>
    <rect x="654" y="868" width="372" height="66" rx="8" fill="#e0a43a"/>
    <text x="686" y="909" font-size="21" fill="#0b1b31">BRIGHTER OPPORTUNITIES</text>
    <rect x="672" y="800" width="340" height="64" rx="8" fill="#fbf8f2"/>
    <text x="704" y="840" font-size="22" fill="#12294a">BETTER RESUME</text>
  </g>

  <!-- foreground depth -->
  <circle cx="140" cy="1300" r="150" fill="#ffffff" opacity="0.12" filter="url(#softer)"/>
</svg>
