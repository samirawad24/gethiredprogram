<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-hidden="true" preserveAspectRatio="xMidYMid slice">
  <!-- Brand art: the open notebook from the boards. The three lines are the
       promise, written out. Replace with a real photo via site.images.notebook. -->
  <defs>
    <linearGradient id="nbDesk" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#c8a87c"/>
      <stop offset="1" stop-color="#9d7a4d"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0ebe1"/>
    </linearGradient>
    <filter id="nbSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1400" height="1000" fill="url(#nbDesk)"/>
  <circle cx="1180" cy="120" r="300" fill="#ffffff" opacity="0.16" filter="url(#nbSoft)"/>

  <!-- notebook -->
  <g transform="rotate(-4 700 520)">
    <rect x="236" y="196" width="800" height="648" rx="14" fill="#8a6a3f" opacity="0.32" filter="url(#nbSoft)"/>
    <rect x="228" y="182" width="800" height="648" rx="12" fill="url(#page)"/>
    <rect x="228" y="182" width="34" height="648" fill="#12294a" opacity="0.9"/>
    <g stroke="#c9d2de" stroke-width="2">
      <path d="M300 300h680M300 372h680M300 444h680M300 516h680M300 588h680M300 660h680M300 732h680"/>
    </g>
    <path d="M300 240h680" stroke="#e0a43a" stroke-width="3"/>

    <!-- the list, written out -->
    <g fill="#e0a43a">
      <circle cx="306" cy="408" r="9"/>
      <circle cx="306" cy="552" r="9"/>
      <circle cx="306" cy="696" r="9"/>
    </g>
    <g font-family="Georgia, serif" font-style="italic" fill="#12294a" font-size="34" opacity="0.8">
      <text x="336" y="418">Better resume</text>
      <text x="336" y="562">Brighter opportunities</text>
      <text x="336" y="706">You got this</text>
    </g>
  </g>

  <!-- pen -->
  <g transform="rotate(22 1140 700)">
    <rect x="1050" y="668" width="230" height="20" rx="10" fill="#12294a"/>
    <polygon points="1280,668 1330,678 1280,688" fill="#e0a43a"/>
    <rect x="1086" y="668" width="26" height="20" fill="#e0a43a" opacity="0.85"/>
  </g>

  <!-- mug -->
  <g>
    <ellipse cx="150" cy="872" rx="104" ry="20" fill="#7d5f38" opacity="0.34" filter="url(#nbSoft)"/>
    <path d="M232 744h30a40 40 0 0 1 0 80h-30z" fill="none" stroke="#12294a" stroke-width="15"/>
    <rect x="58" y="732" width="180" height="140" rx="18" fill="#12294a"/>
    <ellipse cx="148" cy="736" rx="90" ry="16" fill="#1d3c68"/>
    <circle cx="148" cy="802" r="34" fill="none" stroke="#e0a43a" stroke-width="3"/>
  </g>
</svg>
