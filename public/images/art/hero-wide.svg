<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-hidden="true" preserveAspectRatio="xMidYMid slice">
  <!-- Brand art: city at dusk, echoing the "brighter future" hero on the boards.
       Sits behind a navy scrim, so it reads as atmosphere, not detail.
       Replace with a real photo by pointing site.images.heroWide at it. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#0b1b31"/>
      <stop offset="0.42" stop-color="#1d3c68"/>
      <stop offset="0.72" stop-color="#a86f3c"/>
      <stop offset="0.92" stop-color="#e0a43a"/>
      <stop offset="1" stop-color="#f3c777"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.68" cy="0.82" r="0.42">
      <stop offset="0" stop-color="#ffd489" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#e0a43a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e0a43a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="towerFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#32537f"/>
      <stop offset="1" stop-color="#1b3557"/>
    </linearGradient>
    <linearGradient id="towerMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3557"/>
      <stop offset="1" stop-color="#101f36"/>
    </linearGradient>
    <linearGradient id="towerNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1a2e"/>
      <stop offset="1" stop-color="#070f1c"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e0a43a" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#e0a43a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <ellipse cx="1310" cy="885" rx="820" ry="470" fill="url(#sun)"/>

  <!-- far skyline -->
  <g fill="url(#towerFar)" opacity="0.72">
    <rect x="60" y="520" width="92" height="560"/>
    <rect x="178" y="600" width="70" height="480"/>
    <rect x="286" y="470" width="110" height="610"/>
    <rect x="430" y="580" width="84" height="500"/>
    <rect x="556" y="516" width="66" height="564"/>
    <rect x="1290" y="548" width="96" height="532"/>
    <rect x="1420" y="486" width="78" height="594"/>
    <rect x="1534" y="590" width="104" height="490"/>
    <rect x="1676" y="528" width="86" height="552"/>
    <rect x="1800" y="604" width="82" height="476"/>
  </g>

  <!-- mid skyline -->
  <g fill="url(#towerMid)">
    <rect x="120" y="660" width="128" height="420"/>
    <rect x="272" y="596" width="150" height="484"/>
    <rect x="452" y="700" width="112" height="380"/>
    <rect x="596" y="626" width="136" height="454"/>
    <rect x="1186" y="640" width="142" height="440"/>
    <rect x="1356" y="586" width="118" height="494"/>
    <rect x="1502" y="676" width="150" height="404"/>
    <rect x="1686" y="618" width="126" height="462"/>
    <!-- spires -->
    <rect x="330" y="540" width="14" height="60"/>
    <rect x="1408" y="524" width="12" height="64"/>
  </g>

  <!-- lit windows -->
  <g fill="#f3c777" opacity="0.5">
    <rect x="146" y="700" width="14" height="20"/><rect x="176" y="742" width="14" height="20"/>
    <rect x="206" y="700" width="14" height="20"/><rect x="146" y="786" width="14" height="20"/>
    <rect x="300" y="640" width="15" height="22"/><rect x="336" y="686" width="15" height="22"/>
    <rect x="372" y="640" width="15" height="22"/><rect x="300" y="732" width="15" height="22"/>
    <rect x="336" y="778" width="15" height="22"/>
    <rect x="626" y="668" width="14" height="20"/><rect x="662" y="712" width="14" height="20"/>
    <rect x="698" y="668" width="14" height="20"/>
    <rect x="1216" y="684" width="15" height="22"/><rect x="1254" y="730" width="15" height="22"/>
    <rect x="1292" y="684" width="15" height="22"/>
    <rect x="1386" y="628" width="14" height="20"/><rect x="1422" y="674" width="14" height="20"/>
    <rect x="1532" y="716" width="15" height="22"/><rect x="1572" y="762" width="15" height="22"/>
    <rect x="1716" y="660" width="14" height="20"/><rect x="1752" y="706" width="14" height="20"/>
  </g>

  <!-- near towers, framing the edges so the centre stays open for text -->
  <g fill="url(#towerNear)">
    <rect x="0" y="392" width="176" height="688"/>
    <rect x="1774" y="430" width="146" height="650"/>
  </g>
  <g fill="#f3c777" opacity="0.28">
    <rect x="34" y="470" width="18" height="26"/><rect x="82" y="470" width="18" height="26"/>
    <rect x="34" y="546" width="18" height="26"/><rect x="130" y="546" width="18" height="26"/>
    <rect x="82" y="622" width="18" height="26"/><rect x="34" y="698" width="18" height="26"/>
    <rect x="1812" y="508" width="18" height="26"/><rect x="1862" y="584" width="18" height="26"/>
    <rect x="1812" y="660" width="18" height="26"/>
  </g>

  <rect y="700" width="1920" height="380" fill="url(#haze)"/>
</svg>
